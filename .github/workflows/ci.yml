name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n tests/test_install.sh
      - name: Run ShellCheck
        run: shellcheck install.sh tests/test_install.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests with system bash (3.2)
        run: /bin/bash tests/test_install.sh
      - name: Run tests with Homebrew bash
        run: |
          if [ -x /opt/homebrew/bin/bash ]; then
            /opt/homebrew/bin/bash tests/test_install.sh
          fi
